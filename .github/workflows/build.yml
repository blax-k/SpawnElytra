name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --parallel --console=plain

      - name: Check commit id
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: SpawnElytra-${{ steps.commit.outputs.short_sha }}
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-original.jar
          if-no-files-found: error
          retention-days: 14

  build-fabric:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          # Minecraft 26.x needs Java 25; the 1.21.x jars are compiled with --release 21.
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            fabric/*.gradle*
            fabric/stonecutter.properties.toml
            fabric/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x fabric/gradlew

      - name: Build all Fabric version nodes
        working-directory: fabric
        run: ./gradlew buildAll --no-daemon --console=plain

      - name: Check commit id
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload Fabric build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: SpawnElytra-Fabric-${{ steps.commit.outputs.short_sha }}
          path: fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
