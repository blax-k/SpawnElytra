name: SpawnElytra
version: ${version}
main: com.blaxk.spawnelytra.Main
description: Players can use an invisible elytra in configurable zones
author: blaxk
website: https://modrinth.com/plugin/spawn-elytra
prefix: Spawn Elytra
api-version: 1.21
folia-supported: true

softdepend: [PlaceholderAPI, floodgate, Geyser-Spigot]

commands:
  spawnelytra:
    description: Main command for the Spawn Elytra plugin
    usage: /spawnelytra [zone|global|toggle|stats|info|reload|update|visualize|settings|setup]
    aliases: [se]

permissions:
  spawnelytra.admin:
    description: Allows access to admin commands
    default: op
  spawnelytra.use:
    description: Allows players to use the elytra boost feature
    default: true
  spawnelytra.useboost:
    description: Allows players to use the boost feature
    default: true
  spawnelytra.info:
    description: Allows /spawnelytra info
    default: true
  spawnelytra.toggle:
    description: Allows players to turn spawn elytra on or off for themselves (/spawnelytra toggle)
    default: true
  spawnelytra.stats:
    description: Allows players to see their own statistics (/spawnelytra stats)
    default: true
  spawnelytra.stats.others:
    description: Allows /spawnelytra stats <player>
    default: op
